run_name: "cifar10_cfg"

### model params
Model:
  in_channels: 3
  out_channels: 3
  model_channels: 128
  attention_resolutions: [2, ]
  num_res_blocks: 2
  dropout: 0.1
  channel_mult: [1, 2, 2, 2]
  conv_resample: True
  num_heads: 4
  num_classes: 10  # 10 CIFAR-10 classes (null class = all zeros)

### dataset params
Dataset:
  # Deciding which dataset to use, must be one of {'mnist', 'cifar', 'custom'}.
  dataset: "cifar"
  # If mnist and cifar datasets, whether to use the training set.
  train: True
  # Folder of data sets. When `dataset = custom`, this parameter can be a list with different folders.
  # Then all images in the list with suffixes in `suffix` in the folder will be loaded.
  data_path: "./data"
  # If mnist and cifar datasets, whether to download it.
  download: True
  # If mnist dataset, image_size is [28, 28]. If cifar dataset, image_size is [32, 32]. If custom, specify as needed.
  image_size: [ 32, 32 ]

  # If custom dataset, what is the mode of the image. must be one of {'RGB', 'L', 'CMYK'}.
  mode: "RGB"
  # If custom dataset, decide what suffix to load for the image.
  suffix: ["png", "jpg"]

  # parameters for torch.utils.data.DataLoader
  batch_size: 256
  shuffle: True
  drop_last: True
  pin_memory: True
  num_workers: 2  # Reduced from 4 to match HPC system recommendation

### trainer params
Trainer:
  # sample time steps
  T: 1000
  beta: [0.0001, 0.02]

### ===================================================================
### CFG (Classifier-Free Guidance) Parameters
### ===================================================================
# Probability of dropping class conditioning during training (p_cfg)
#
# This determines how often the model sees unconditional samples (null embedding).
# During training, with probability cfg_dropout_prob, the class embedding is
# replaced with all zeros [0, 0, ..., 0].
#
# Typical values:
#   - 0.1 (10%):  Standard CFG training, good balance
#   - 0.15 (15%): More unconditional training, stronger guidance capability
#   - 0.2 (20%):  High dropout, may weaken pure conditional performance
#
# Recommended: Start with 0.1 and increase if you need stronger CFG
cfg_dropout_prob: 0.1

# Default guidance scale for generation (w)
#
# This controls the strength of classifier-free guidance during sampling.
# Formula: ε_guided = ε_uncond + w * (ε_cond - ε_uncond)
#
# Guidance scale values:
#   - 0.0:     Pure unconditional (ignores class labels)
#   - 1.0:     Pure conditional (standard DDPM, no guidance)
#   - 2.0-3.0: Mild guidance (slight quality improvement)
#   - 3.0-5.0: Moderate guidance (good balance) ← RECOMMENDED
#   - 5.0-7.0: Strong guidance (better quality, less diversity)
#   - 7.0-10.0: Very strong guidance (may cause artifacts)
#   - 10.0+:   Extreme guidance (likely to cause artifacts)
#
# Note: This is just the default value. You can override it via command-line
# in generate_cfg.py using the --guidance_scale parameter.
#
# Recommended: Start with 3.0 for CIFAR-10
guidance_scale: 3.0

### callback params
Callback:
  # The save path for checkpoint.
  filepath: "./checkpoint/{run_name}.pth"
  # Frequency of checkpoint saving.
  save_freq: 1

### train params
device: "cuda:0"
epochs: 300
# Whether to continue training, True or False
consume: False
# If continue training, which checkpoint to load
consume_path: "./checkpoint/{run_name}.pth"

### optimizer params
lr: 0.0003
